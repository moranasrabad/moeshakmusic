<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' moeshak-stream: moeshak-local: moeshak-art:; img-src 'self' data: moeshak-art:; media-src 'self' moeshak-stream: moeshak-local:; style-src 'self' 'unsafe-inline'; script-src 'self'" />
  <title>موشک موزیک</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- SVG icon sprite -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="i-play" viewBox="0 0 24 24"><path d="M8 5v14l11-7z" fill="currentColor"/></symbol>
    <symbol id="i-pause" viewBox="0 0 24 24"><path d="M6 5h4v14H6zM14 5h4v14h-4z" fill="currentColor"/></symbol>
    <symbol id="i-prev" viewBox="0 0 24 24"><path d="M7 6h2v12H7zM20 6v12L9 12z" fill="currentColor"/></symbol>
    <symbol id="i-next" viewBox="0 0 24 24"><path d="M15 6h2v12h-2zM4 6v12l11-6z" fill="currentColor"/></symbol>
    <symbol id="i-shuffle" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 3h5v5"/><path d="M4 20 21 3"/><path d="M21 16v5h-5"/><path d="M15 15l6 6"/><path d="M4 4l5 5"/></symbol>
    <symbol id="i-repeat" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 2l4 4-4 4"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><path d="M7 22l-4-4 4-4"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></symbol>
    <symbol id="i-dl" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="M7 10l5 5 5-5"/><path d="M5 21h14"/></symbol>
    <symbol id="i-expand" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h6v6"/><path d="M9 21H3v-6"/><path d="M21 3l-7 7"/><path d="M3 21l7-7"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></symbol>
  </svg>
  <!-- LOGIN -->
  <div id="login" class="screen hidden">
    <div class="login-card">
      <img id="loginLogo" src="../assets/icon.png" class="login-logo" alt="Moeshak" />
      <h1 data-i18n="appName">موشک موزیک</h1>
      <p class="sub" data-i18n="loginSub">پلیر موزیک متصل به تلگرام — مستقیم با TDLib</p>

      <div class="login-tabs">
        <button id="tabPhone" class="seg active" data-i18n="phone">شماره تلفن</button>
        <button id="tabQr" class="seg" data-i18n="qrLogin">ورود با QR</button>
      </div>

      <div id="loginPhone">
        <input id="phoneInput" placeholder="+98912..." dir="ltr" />
        <button id="phoneNext" class="btn primary" data-i18n="next">ادامه</button>
      </div>

      <div id="loginCode" class="hidden">
        <p class="hint" data-i18n="codeSent">کد تأیید به تلگرام فرستاده شد</p>
        <input id="codeInput" placeholder="•••••" dir="ltr" maxlength="8" />
        <button id="codeNext" class="btn primary" data-i18n="next">ادامه</button>
      </div>

      <div id="loginPassword" class="hidden">
        <p class="hint" id="passwordHint"></p>
        <input id="passwordInput" type="password" placeholder="Password" dir="ltr" />
        <button id="passwordNext" class="btn primary" data-i18n="next">ادامه</button>
      </div>

      <div id="loginRegister" class="hidden">
        <input id="firstNameInput" placeholder="First name" dir="ltr" />
        <input id="lastNameInput" placeholder="Last name" dir="ltr" />
        <button id="registerNext" class="btn primary" data-i18n="signUp">ثبت‌نام</button>
      </div>

      <div id="loginQr" class="hidden">
        <p class="hint" data-i18n="qrHint">تلگرام ← تنظیمات ← دستگاه‌ها ← اتصال دستگاه ← اسکن کن</p>
        <div id="qrBox"><img id="qrImg" alt="QR" /></div>
        <button id="qrRefresh" class="btn ghost" data-i18n="refresh">تازه‌سازی</button>
      </div>

      <p id="loginError" class="error hidden"></p>
      <p class="status-line" id="connStatus"></p>
    </div>
  </div>

  <!-- MAIN APP -->
  <div id="app" class="screen hidden">
    <aside id="sidebar">
      <div class="brand">
        <img id="brandLogo" src="../assets/icon.png" alt="" />
        <span>موشک موزیک</span>
      </div>
      <nav id="nav"></nav>
      <div class="sidebar-foot">
        <div id="meBox" class="me-box hidden"></div>
        <button id="logoutBtn" class="btn ghost small" data-i18n="logout">خروج</button>
      </div>
    </aside>

    <main id="content">
      <header id="topbar">
        <h2 id="pageTitle"></h2>
        <div id="topActions"></div>
      </header>
      <div id="tabBody" class="tab-body"></div>
    </main>

    <!-- player bar -->
    <div id="playerBar" class="player-bar hidden">
      <div class="pb-left">
        <div id="pbCover" class="pb-cover"></div>
        <div class="pb-meta">
          <div id="pbTitle" class="pb-title">—</div>
          <div id="pbArtist" class="pb-artist"></div>
        </div>
      </div>
      <div class="pb-center">
        <div class="pb-controls">
          <button id="pbShuffle" class="ic" title="shuffle"><svg width="18" height="18"><use href="#i-shuffle"/></svg></button>
          <button id="pbPrev" class="ic big"><svg width="22" height="22"><use href="#i-prev"/></svg></button>
          <button id="pbPlay" class="ic big"><svg width="24" height="24"><use href="#i-play"/></svg></button>
          <button id="pbNext" class="ic big"><svg width="22" height="22"><use href="#i-next"/></svg></button>
          <button id="pbRepeat" class="ic"><svg width="18" height="18"><use href="#i-repeat"/></svg></button>
        </div>
        <div class="pb-progress">
          <span id="pbCur">0:00</span>
          <input type="range" id="pbSeek" min="0" max="1000" value="0" />
          <span id="pbDur">0:00</span>
        </div>
      </div>
      <div class="pb-right">
        <button id="pbDl" class="ic" title="download"><svg width="18" height="18"><use href="#i-dl"/></svg></button>
        <button id="pbExpand" class="ic"><svg width="18" height="18"><use href="#i-expand"/></svg></button>
      </div>
    </div>
  </div>

  <!-- NOW PLAYING overlay -->
  <div id="np" class="np hidden">
    <button id="npClose" class="np-close"><svg width="18" height="18"><use href="#i-close"/></svg></button>
    <canvas id="viz" width="640" height="200"></canvas>
    <div id="npCover" class="np-cover"></div>
    <div id="npTitle" class="np-title">—</div>
    <div id="npArtist" class="np-artist"></div>
    <div class="np-dl">
      <button id="npDl" class="btn ghost small" style="display:flex;align-items:center;gap:6px"><svg width="16" height="16"><use href="#i-dl"/></svg><span id="npDlText"></span></button>
      <span id="npDlStatus"></span>
    </div>
    <div class="np-progress">
      <span id="npCur">0:00</span>
      <input type="range" id="npSeek" min="0" max="1000" value="0" />
      <span id="npDur">0:00</span>
    </div>
    <div class="np-controls">
      <button id="npShuffle" class="ic big"><svg width="24" height="24"><use href="#i-shuffle"/></svg></button>
      <button id="npPrev" class="ic big"><svg width="30" height="30"><use href="#i-prev"/></svg></button>
      <button id="npPlay" class="ic big"><svg width="34" height="34"><use href="#i-play"/></svg></button>
      <button id="npNext" class="ic big"><svg width="30" height="30"><use href="#i-next"/></svg></button>
      <button id="npRepeat" class="ic big"><svg width="24" height="24"><use href="#i-repeat"/></svg></button>
    </div>
  </div>

  <audio id="audio"></audio>
  <script src="app.js"></script>
</body>
</html>
