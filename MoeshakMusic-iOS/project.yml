name: MoeshakMusic
options:
  bundleIdPrefix: ir.moeshakteam
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

packages:
  TDLibFramework:
    url: https://github.com/Swiftgram/TDLibFramework
    exactVersion: 1.8.66-022d6020

targets:
  MoeshakMusic:
    type: application
    platform: iOS
    sources:
      - path: MoeshakMusic
    dependencies:
      - package: TDLibFramework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ir.moeshakteam.moeshakmusic
        MARKETING_VERSION: 6.0.2
        CURRENT_PROJECT_VERSION: 10000
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: MoeshakMusic/Info.plist
      properties:
        CFBundleDisplayName: موشک موزیک
        CFBundleDevelopmentRegion: fa
        CFBundleLocalizations:
          - fa
          - en
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIBackgroundModes:
          - audio
        NSMicrophoneUsageDescription: برای ویژوالایزر زندهٔ Now Playing — صدا هیچ‌جا ذخیره نمی‌شود.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true

schemes:
  MoeshakMusic:
    build:
      targets:
        MoeshakMusic: all
    run:
      config: Debug
    archive:
      config: Release
