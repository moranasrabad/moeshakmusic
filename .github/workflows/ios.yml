name: iOS Build

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to attach IPA to'
        default: 'v6.0.2'
  push:
    branches: [main]
    paths:
      - 'MoeshakMusic-iOS/**'
      - '.github/workflows/ios.yml'

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: MoeshakMusic-iOS
        run: xcodegen

      - name: Build (unsigned, device)
        working-directory: MoeshakMusic-iOS
        run: |
          set -o pipefail
          xcodebuild -project MoeshakMusic.xcodeproj \
            -scheme MoeshakMusic \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee build.log | tail -30

      - name: Verify app bundle
        id: verify
        run: |
          APP="MoeshakMusic-iOS/build/Build/Products/Release-iphoneos/MoeshakMusic.app"
          if [ -d "$APP" ]; then
            echo "status=ok" >> $GITHUB_OUTPUT
            echo "App built successfully"
          else
            echo "status=failed" >> $GITHUB_OUTPUT
            echo "Build failed"
            grep -E "error:" MoeshakMusic-iOS/build.log | head -30 || true
            exit 1
          fi

      - name: Package unsigned IPA
        if: steps.verify.outputs.status == 'ok'
        run: |
          rm -rf Payload MoeshakMusic-v6.0.2-unsigned.ipa
          mkdir -p Payload
          cp -R MoeshakMusic-iOS/build/Build/Products/Release-iphoneos/MoeshakMusic.app Payload/
          zip -qry MoeshakMusic-v6.0.2-unsigned.ipa Payload
          ls -la MoeshakMusic-v6.0.2-unsigned.ipa

      - name: Upload artifact
        if: steps.verify.outputs.status == 'ok'
        uses: actions/upload-artifact@v4
        with:
          name: moeshak-ios
          path: MoeshakMusic-v6.0.2-unsigned.ipa

      - name: Attach to GitHub release
        if: steps.verify.outputs.status == 'ok'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${{ github.event.inputs.tag }}"
          if [ -z "$tag" ]; then tag="v6.0.2"; fi
          gh release upload "$tag" MoeshakMusic-v6.0.2-unsigned.ipa --clobber
