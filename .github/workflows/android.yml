name: Android Build

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to attach APKs to'
        default: 'v6.0.3'
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - '.github/workflows/android.yml'

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-33 build-tools;33.0.2 platform-tools'

      - name: Install Gradle 7.6.4
        run: |
          wget -q https://services.gradle.org/distributions/gradle-7.6.4-bin.zip -O /tmp/gradle.zip
          sudo unzip -q /tmp/gradle.zip -d /opt
          echo "/opt/gradle-7.6.4/bin" >> $GITHUB_PATH

      - name: Prepare TDLib native libraries
        run: |
          if [ ! -f app/src/main/jniLibs/arm64-v8a/libtdjson.so ]; then
            bash ./setup-abis.sh
          fi

      - name: Build slim APK (arm64 only)
        run: gradle --no-daemon assembleRelease -Pslim

      - name: Stash slim APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk out/MoeshakMusic-v6.0.3-slim-arm64.apk

      - name: Build full APK (arm64 + armv7 + x86_64/WSA)
        run: gradle --no-daemon assembleRelease

      - name: Build AAB
        run: gradle --no-daemon bundleRelease

      - name: Collect artifacts
        run: |
          cp app/build/outputs/apk/release/app-release.apk out/MoeshakMusic-v6.0.3.apk
          cp app/build/outputs/bundle/release/app-release.aab out/MoeshakMusic-v6.0.3.aab 2>/dev/null || true
          ls -la out/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: moeshak-android
          path: out/*

      - name: Attach to GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${{ github.event.inputs.tag }}"
          if [ -z "$tag" ]; then tag="v6.0.3"; fi
          gh release upload "$tag" out/* --clobber
